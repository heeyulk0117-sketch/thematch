<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>더매치 | YouTube 24시간 무료 라이브 소개팅</title>
<meta name="description" content="더매치 유튜브 채널 - 지금 방송 중인 YouTube 라이브로 바로 이동">
<meta property="og:title" content="더매치 | YouTube 24시간 무료 라이브 소개팅">
<meta property="og:description" content="지금 방송 중인 YouTube 라이브로 바로 이동">
<meta property="og:image" content="https://thematch.live/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:url" content="https://thematch.live/">
<meta name="theme-color" content="#0f0f0f">
<link rel="icon" href="logo.png">
<!-- 글씨체: 프리텐다드(사용자 11-05 카톡 배너 '글씨체가 이상해' → 페이지 전체를 한 글씨체로) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 유튜브 다크 화면 색(사용자 11-05 '유튜브 표시가 없어서 불법 사이트 같다' → 유튜브로 간다는 게 보이게) */
  :root { --bg: #0f0f0f; --card: #212121; --line: #303030; --text: #f1f1f1; --dim: #aaaaaa; --red: #ff0033; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
         font: 15px/1.45 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         letter-spacing: -0.01em; }
  button { font-family: inherit; }
  main { max-width: 460px; margin: 0 auto; padding: 24px 16px 32px; }
  a { color: inherit; text-decoration: none; }
  .yt { display: inline-block; width: 22px; height: 16px; vertical-align: -3px; flex: none; }

  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .head img { width: 56px; height: 56px; border-radius: 50%; }
  .head h1 { margin: 0; font-size: 20px; }
  .head p { margin: 2px 0 0; color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 6px; }

  .now { display: none; margin-bottom: 20px; }
  .thumb { position: relative; display: block; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 16 / 9; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; left: 8px; bottom: 8px; background: var(--red); color: #fff; font-size: 12px; font-weight: 700;
           padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; gap: 4px; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .play { position: absolute; inset: 0; margin: auto; width: 68px; height: 48px; }
  .meta { display: flex; gap: 10px; margin-top: 10px; }
  .meta img { width: 36px; height: 36px; border-radius: 50%; flex: none; }
  .meta .t { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta .c { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .go { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; padding: 12px; border-radius: 99px;
        background: #f1f1f1; color: #0f0f0f; font-weight: 700; font-size: 16px; }
  .bar { height: 3px; margin-top: 10px; border-radius: 99px; background: var(--red); transform-origin: left; animation: shrink var(--wait) linear forwards; }
  @keyframes shrink { to { transform: scaleX(0); } }
  .count { color: var(--dim); font-size: 12px; margin-top: 6px; text-align: center; }

  h2 { font-size: 16px; margin: 0 0 8px; }
  .idle { color: var(--dim); font-size: 13px; margin: 0 0 10px; display: none; }
  .list { display: grid; gap: 2px; }
  .m { display: flex; align-items: center; gap: 8px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .m .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
  .m img { width: 44px; height: 44px; border-radius: 50%; flex: none; background: var(--card); }
  .m .n { flex: 1; min-width: 0; }
  .m .n b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m .n span { color: var(--dim); font-size: 12px; }
  .m .r { font-size: 12px; color: var(--dim); text-align: right; flex: none; }
  .sub { flex: none; padding: 6px 12px; border-radius: 99px; background: #f1f1f1; color: #0f0f0f; font-size: 13px; font-weight: 700; }
  .m.on img { outline: 2px solid var(--red); outline-offset: 2px; }
  .m.on .r { color: #fff; background: var(--red); padding: 2px 8px; border-radius: 4px; font-weight: 700; }
  footer { margin-top: 20px; color: var(--dim); font-size: 12px; text-align: center; line-height: 1.7; }
  .about { margin: 14px 0 12px; padding: 14px 12px; border-radius: 12px; background: var(--card); color: #d0d0d0; font-size: 13px; }
  .about b { display: block; color: var(--text); font-size: 14px; margin-bottom: 4px; }
  /* 카톡 아이디 카드(사용자 11-05 '카카오톡 로고랑 match 크게 - 있어 보이게') */
  /* 카카오 공식 버튼 모양: 노랑 #FEE500, 검은 말풍선, 글자 검정 85% */
  .kakao { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: #fee500;
           color: rgba(0, 0, 0, .85); text-align: left; }
  .kakao svg.talk { width: 56px; height: 51px; flex: none; font-family: "Pretendard Variable", Pretendard, Arial, sans-serif; }
  .kakao .k { flex: 1; min-width: 0; }
  .kakao .k1 { font-size: 15px; font-weight: 600; color: rgba(0, 0, 0, .7); line-height: 1.3; }
  .kakao .k2 { font-size: 30px; font-weight: 800; line-height: 1.2; letter-spacing: 0; }
  .kakao .k2 small { font-size: 16px; font-weight: 700; margin-right: 6px; color: rgba(0, 0, 0, .55); }
  .kakao { flex-wrap: wrap; }  /* 휴대폰 폭에서 글씨가 꺾이지 않게 복사 버튼은 아래 한 줄 전체로 */
  .kakao button { flex: 1 0 100%; margin-top: 2px; border: 0; border-radius: 10px; padding: 12px; background: rgba(0, 0, 0, .85);
                  color: #fee500; font-size: 15px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="yt" viewBox="0 0 28 20"><rect width="28" height="20" rx="5" fill="#ff0033"/><path d="M11.2 5.6 18.6 10l-7.4 4.4z" fill="#fff"/></symbol>
</svg>
<main>
  <div class="head">
    <img src="logo.png" alt="더매치">
    <div>
      <h1>더매치</h1>
      <p><svg class="yt"><use href="#yt"/></svg>YouTube 24시간 무료 라이브 소개팅</p>
    </div>
  </div>

  <div class="now" id="now">
    <a class="thumb" id="thumbLink" href="#">
      <img id="thumb" alt="">
      <svg class="play"><use href="#yt"/></svg>
      <span class="badge">실시간</span>
    </a>
    <div class="meta">
      <img id="nowAv" alt="">
      <div>
        <div class="t" id="nowTitle">지금 라이브 중</div>
        <div class="c" id="nowCh"></div>
      </div>
    </div>
    <a class="go" id="go" href="#"><svg class="yt"><use href="#yt"/></svg>YouTube에서 라이브 보기</a>
    <div class="bar" id="bar"></div>
    <div class="count" id="count">곧 YouTube로 이동 · 화면 터치 시 멈춤</div>
  </div>

  <h2>더매치 채널</h2>
  <p class="idle" id="idle">지금은 방송 준비 중 · 채널을 눌러 YouTube에서 보기</p>
  <div class="list" id="list"></div>
  <footer>
    모든 버튼은 youtube.com 더매치 공식 채널로 연결
    <div class="about">
      <b>24시간 무료 라이브 소개팅, 더매치</b>
      라이브로 카톡 연결해 주는 무료 소개팅<br>
      구독하고 라이브 알림 받기
    </div>
    <div class="kakao">
      <!-- 말풍선만으로는 카톡인지 몰라서(사용자 11-05) 카카오톡 앱 아이콘처럼 TALK 말풍선 + '카카오톡' 글자 -->
      <svg class="talk" viewBox="0 0 46 42" aria-label="카카오톡"><path d="M23 2C11.4 2 2 9.4 2 18.6c0 5.9 3.9 11.1 9.8 14l-2.4 8.6c-.2.7.6 1.3 1.2.9l10.2-6.8c.7.1 1.5.1 2.2.1 11.6 0 21-7.4 21-16.6S34.6 2 23 2z" fill="#3a1d1d"/><text x="23" y="23.3" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing=".3" fill="#fee500">TALK</text></svg>
      <div class="k">
        <div class="k1">카카오톡으로 무료 소개팅 지원</div>
        <div class="k2"><small>ID</small>match</div>
      </div>
      <button type="button" id="copyId">카톡 ID 복사하기</button>
    </div>
  </footer>
</main>
<script>
// 멤버 순서(사용자 11-05 '몽멘 융군제 킹우진 도민호 우상2'), 평소 방송 시간, 채널 사진.
// 누가 방송 중인지는 봇이 live.json 에 적는다(3분마다 확인).
const MEMBERS = [
  { ch: "몽멘", name: "더매치스튜디오 (몽멘)", handle: "@더매치_몽멘", time: "밤 8시",
    av: "https://yt3.ggpht.com/ilHQCE3HPD1PYgqKNKZMR0LFwaZwkGeSNZ6YjCMacXiL7BZW_umjUW8bXEoyn0_U7gNmLrK1tg=s240-c-k-c0x00ffffff-no-rj" },
  { ch: "융군제", name: "융군제", handle: "@더매치_융군제", time: "새벽 1시",
    av: "https://yt3.ggpht.com/RYo6CLgSxGXlXFxRc8IGhvOLeaZYXSIJ-I81ubTzCo2pNjMFY-vtIVe4wSHxFNgj9M3uSi2i_A=s240-c-k-c0x00ffffff-no-rj" },
  { ch: "킹우진", name: "킹우진", handle: "@더매치_킹우진", time: "오후 3시",
    av: "https://yt3.ggpht.com/aeD-os5MYanb0gnL_Ioo5vXAR0kDCz1bHxcnbkDL1PVQdLpj-rhP-TpUcPxNDQ6TLiwzAa8dBA=s240-c-k-c0x00ffffff-no-rj" },
  { ch: "도민호", name: "도민호", handle: "@더매치_도민호", time: "아침 6시",
    av: "https://yt3.ggpht.com/_4Ev1XfSR857rfULkR7iKNrOCeNIfhwuhWfreSyDyRQTkpF1gvmfLZ1v-DfLINpuMOJq2MuX=s240-c-k-c0x00ffffff-no-rj" },
  { ch: "우상2", name: "우상2", handle: "@더매치_우상2", time: "랜덤",
    av: "https://yt3.ggpht.com/aPROL2mC4eNo77ttABpAmXxL-J4SQP1LX_66uexMqtHxWy-ojGtPKwzcck3kj8tWn7seevCfKg=s240-c-k-c0x00ffffff-no-rj" },
];
const WAIT_MS = 5000;      // 자동으로 넘어가기까지(사용자 11-05 1.5초 → 3초 → '5초로 하자')
const STALE_MIN = 150;     // live.json 이 이보다 오래되면 봇이 멈춘 것으로 보고 자동 이동 안 함

const $ = (id) => document.getElementById(id);
const chanUrl = (m) => "https://www.youtube.com/" + m.handle + "/live";
const liveUrl = (id) => "https://www.youtube.com/watch?v=" + id;
const noImg = (img) => { img.onerror = () => { img.style.visibility = "hidden"; }; };

function draw(live) {
  const on = MEMBERS.filter((m) => live[m.ch]);
  // 목록은 방송 여부와 상관없이 정한 순서 그대로(사용자 11-05 '몽멘이 맨 위로'). 방송 중인 채널은 LIVE 표시만
  for (const m of MEMBERS) {
    // 줄 = [채널(라이브·채널로)] + [구독(유튜브 구독 확인 창이 바로 뜨는 주소)]
    const a = document.createElement("div");
    a.className = "m" + (live[m.ch] ? " on" : "");
    a.innerHTML = "<a class='main'><img alt=''><div class='n'><b></b><span></span></div><div class='r'></div></a>"
      + "<a class='sub'>구독</a>";
    a.querySelector(".main").href = live[m.ch] ? liveUrl(live[m.ch]) : chanUrl(m);
    a.querySelector(".sub").href = "https://www.youtube.com/" + m.handle + "?sub_confirmation=1";
    noImg(a.querySelector("img"));
    a.querySelector("img").src = m.av;
    a.querySelector("b").textContent = m.name;
    a.querySelector(".n span").textContent = m.handle;  // 구독자 수는 사용자 11-05 '구독자수는 빼'
    a.querySelector(".r").textContent = live[m.ch] ? "LIVE" : m.time;
    $("list").appendChild(a);
  }
  if (!on.length) { $("idle").style.display = "block"; return; }

  // 보낼 곳: 주소에 ?c=채널 이 있고 그 채널이 방송 중이면 거기, 아니면 방송 중인 멤버 중 하나
  const want = new URLSearchParams(location.search).get("c");
  const pick = on.find((m) => m.ch === want) || on[Math.floor(Math.random() * on.length)];
  const id = live[pick.ch];
  const url = liveUrl(id);
  $("go").href = $("thumbLink").href = url;
  $("thumb").onerror = () => { $("thumb").onerror = null; $("thumb").src = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg"; };
  $("thumb").src = "https://i.ytimg.com/vi/" + id + "/hqdefault_live.jpg";
  noImg($("nowAv"));
  $("nowAv").src = pick.av;
  $("nowCh").textContent = pick.name + " · " + pick.handle;
  fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent(url))
    .then((r) => r.json()).then((d) => { if (d.title) $("nowTitle").textContent = d.title; }).catch(() => {});
  $("bar").style.setProperty("--wait", WAIT_MS + "ms");
  $("now").style.display = "block";
  const timer = setTimeout(() => location.replace(url), WAIT_MS);
  // 1.5초는 고르기엔 짧다(사용자 '1.5초면 선택할 시간이 있나?'): 화면을 만지거나 스크롤하면 자동 이동을 멈추고 직접 고르게 한다
  const evs = ["pointerdown", "touchstart", "wheel", "scroll", "keydown"];
  const stop = () => {
    clearTimeout(timer);
    $("bar").style.display = "none";
    $("count").textContent = "자동 이동 멈춤 · 보고 싶은 채널 선택";
    for (const ev of evs) removeEventListener(ev, stop, true);
  };
  for (const ev of evs) addEventListener(ev, stop, { capture: true, passive: true });
}

// 카톡 ID 복사(틱톡·인스타 안 브라우저는 clipboard API 가 막힐 수 있어 예전 방식으로도)
$("copyId").addEventListener("click", () => {
  const done = () => { $("copyId").textContent = "복사됨"; };
  const old = () => {
    const t = document.createElement("textarea");
    t.value = "match";
    document.body.appendChild(t);
    t.select();
    try { if (document.execCommand("copy")) done(); } catch (e) { /* 복사 못 하면 글자를 보고 치면 된다 */ }
    t.remove();
  };
  if (navigator.clipboard) navigator.clipboard.writeText("match").then(done, old); else old();
});

(async () => {
  let live = {};
  try {
    const ctl = new AbortController();
    setTimeout(() => ctl.abort(), 3000);
    const r = await fetch("live.json?t=" + Date.now(), { cache: "no-store", signal: ctl.signal });
    const d = await r.json();
    if (d.updated && Date.now() - Date.parse(d.updated) < STALE_MIN * 60000) {
      for (const x of d.live || []) live[x.ch] = x.id;
    }
  } catch (e) { /* 못 읽으면 채널 목록만 보여 준다 */ }
  draw(live);
})();
</script>
</body>
</html>
