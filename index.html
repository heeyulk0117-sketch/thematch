<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>더매치 | 24시간 라이브 소개팅</title>
<meta name="description" content="유튜브 24시간 라이브 소개팅 더매치 - 지금 방송 중인 라이브로 바로 가요">
<meta property="og:title" content="더매치 | 24시간 라이브 소개팅">
<meta property="og:description" content="지금 방송 중인 라이브로 바로 가요">
<meta property="og:image" content="https://thematch.live/logo.png">
<meta property="og:url" content="https://thematch.live/">
<meta name="theme-color" content="#0d0716">
<link rel="icon" href="logo.png">
<style>
  :root { --bg: #0d0716; --card: #1a1029; --line: #3a2560; --text: #f3ecff; --dim: #a996c9; --neon: #b46bff; --live: #ff3b5c; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% -10%, #2b1250 0, var(--bg) 60%); color: var(--text);
         font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 32px 16px 40px; text-align: center; }
  .logo { width: 96px; height: 96px; border-radius: 50%; box-shadow: 0 0 24px var(--neon); }
  h1 { margin: 14px 0 2px; font-size: 26px; letter-spacing: 1px; text-shadow: 0 0 12px var(--neon); }
  .sub { margin: 0 0 22px; color: var(--dim); }
  .now { display: none; margin: 0 0 18px; padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--live); }
  .now b { color: var(--live); }
  .go { display: block; margin-top: 12px; padding: 14px; border-radius: 12px; background: var(--live); color: #fff; font-weight: 700;
        font-size: 18px; text-decoration: none; }
  .count { color: var(--dim); font-size: 14px; margin-top: 8px; }
  .bar { height: 4px; margin-top: 10px; border-radius: 99px; background: var(--live); transform-origin: left; animation: shrink var(--wait) linear forwards; }
  @keyframes shrink { to { transform: scaleX(0); } }
  .list { display: grid; gap: 10px; }
  .m { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 14px; background: var(--card);
       border: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: 17px; font-weight: 600; }
  .m.on { border-color: var(--live); box-shadow: 0 0 12px rgba(255, 59, 92, .35); }
  .tag { font-size: 13px; font-weight: 500; color: var(--dim); }
  .m.on .tag { color: #fff; background: var(--live); padding: 2px 8px; border-radius: 99px; font-weight: 700; }
  .idle { color: var(--dim); font-size: 14px; margin: 0 0 14px; display: none; }
  footer { margin-top: 26px; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="더매치">
  <h1>더매치</h1>
  <p class="sub">유튜브 24시간 라이브 소개팅</p>

  <div class="now" id="now">
    <div>🔴 지금 <b id="nowName"></b> 라이브 중</div>
    <a class="go" id="go" href="#">라이브 보러 가기</a>
    <div class="bar" id="bar"></div>
    <div class="count" id="count">곧 자동으로 넘어가요 · 화면을 만지면 멈춰요</div>
  </div>
  <p class="idle" id="idle">지금은 방송 준비 중이에요. 멤버를 눌러 채널로 가 보세요.</p>

  <div class="list" id="list"></div>
  <footer>💌 소개팅 지원 카톡 'match'</footer>
</main>
<script>
// 멤버 순서와 평소 방송 시간. 누가 방송 중인지는 봇이 live.json 에 적는다(3분마다 확인).
const MEMBERS = [
  { ch: "몽멘", handle: "@더매치_몽멘", time: "밤 8시" },
  { ch: "융군제", handle: "@더매치_융군제", time: "새벽 1시" },
  { ch: "킹우진", handle: "@더매치_킹우진", time: "오후 3시" },
  { ch: "도민호", handle: "@더매치_도민호", time: "아침 6시" },
  { ch: "우상2", handle: "@더매치_우상2", time: "랜덤" },
];  // 순서: 사용자 11-05 '몽멘 융군제 킹우진 도민호 우상2 순서'
const WAIT_MS = 1500;      // 자동으로 넘어가기까지(사용자 11-05 '3초는 너무 느리지 않나' → 1.5초)
const STALE_MIN = 150;     // live.json 이 이보다 오래되면 봇이 멈춘 것으로 보고 자동 이동 안 함

const $ = (id) => document.getElementById(id);
const chanUrl = (m) => "https://www.youtube.com/" + m.handle + "/live";
const liveUrl = (id) => "https://www.youtube.com/watch?v=" + id;

function draw(live) {
  const on = MEMBERS.filter((m) => live[m.ch]);
  const off = MEMBERS.filter((m) => !live[m.ch]);
  $("list").innerHTML = "";
  for (const m of on.concat(off)) {
    const a = document.createElement("a");
    a.className = "m" + (live[m.ch] ? " on" : "");
    a.href = live[m.ch] ? liveUrl(live[m.ch]) : chanUrl(m);
    a.innerHTML = "<span></span><span class='tag'></span>";
    a.children[0].textContent = m.ch;
    a.children[1].textContent = live[m.ch] ? "LIVE" : m.time;
    $("list").appendChild(a);
  }
  if (!on.length) { $("idle").style.display = "block"; return; }

  // 보낼 곳: 주소에 ?c=채널 이 있고 그 채널이 방송 중이면 거기, 아니면 방송 중인 멤버 중 하나
  const want = new URLSearchParams(location.search).get("c");
  const pick = on.find((m) => m.ch === want) || on[Math.floor(Math.random() * on.length)];
  const url = liveUrl(live[pick.ch]);
  $("nowName").textContent = pick.ch;
  $("go").href = url;
  $("bar").style.setProperty("--wait", WAIT_MS + "ms");
  $("now").style.display = "block";
  const timer = setTimeout(() => location.replace(url), WAIT_MS);
  // 1.5초는 고르기엔 짧다(사용자 '1.5초면 선택할 시간이 있나?'): 화면을 만지거나 스크롤하면 자동 이동을 멈추고 직접 고르게 한다
  const stop = () => {
    clearTimeout(timer);
    $("bar").style.display = "none";
    $("count").textContent = "자동 이동 멈춤 · 보고 싶은 멤버를 누르세요";
    for (const ev of ["pointerdown", "touchstart", "wheel", "scroll", "keydown"]) removeEventListener(ev, stop, true);
  };
  for (const ev of ["pointerdown", "touchstart", "wheel", "scroll", "keydown"]) addEventListener(ev, stop, { capture: true, passive: true });
}

(async () => {
  let live = {};
  try {
    const ctl = new AbortController();
    setTimeout(() => ctl.abort(), 3000);
    const r = await fetch("live.json?t=" + Date.now(), { cache: "no-store", signal: ctl.signal });
    const d = await r.json();
    if (d.updated && Date.now() - Date.parse(d.updated) < STALE_MIN * 60000) {
      for (const x of d.live || []) live[x.ch] = x.id;
    }
  } catch (e) { /* 못 읽으면 멤버 버튼만 보여 준다 */ }
  draw(live);
})();
</script>
</body>
</html>
